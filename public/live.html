<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Live Now Playing — Spotify Lyrics Badge</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #05070a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px;
        box-sizing: border-box;
      }
      img#badge {
        width: min(90vw, 480px);
        height: auto;
        filter: drop-shadow(0 12px 32px rgba(0, 0, 0, 0.5));
        transition: opacity 0.25s ease;
      }
      img#badge.fading {
        opacity: 0.4;
      }
      .hint {
        color: #6e7681;
        font-size: 13px;
        text-align: center;
        max-width: 480px;
      }
      .hint code {
        background: #161b22;
        padding: 2px 6px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img id="badge" src="/api/spotify-lyrics" alt="Live now playing" />
      <div class="hint">
        Auto-refreshes every few seconds — this only works on this page, not
        inside a GitHub README (GitHub strips scripts from rendered
        Markdown). Add query params to this page's URL, e.g.
        <code>?theme=dracula</code>, to theme it — see the
        <a href="https://github.com/ibrahim-isikli/spotify-lyrics-badge#-customization--themes">README</a>
        for the full list.
      </div>
    </div>
    <script>
      (function () {
        var img = document.getElementById("badge");
        var REFRESH_MS = 3000;

        function refresh() {
          var params = new URLSearchParams(window.location.search);
          params.set("_", Date.now().toString());
          var next = new Image();
          next.onload = function () {
            img.src = next.src;
            img.classList.remove("fading");
          };
          img.classList.add("fading");
          next.src = "/api/spotify-lyrics?" + params.toString();
        }

        setInterval(refresh, REFRESH_MS);
      })();
    </script>
  </body>
</html>
